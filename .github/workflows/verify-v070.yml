name: Orman Gozu v0.7.0 verification (NO deployment)
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r tools/requirements.txt pytest
      - run: python -m compileall -q backend tools tests
      - run: python -m pytest -q tests backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio cryptography
      - name: Generate compilation-only dummy credentials (never deploy runner bin)
        run: |
          python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import serialization
          import secrets
          public=ec.generate_private_key(ec.SECP256R1()).public_key().public_bytes(
              serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint).hex()
          x=Path('OrmanGozu_Node/src/secrets.h')
          x.write_text('#pragma once\n#define OG_PROVISIONED 1\n' +
              f'#define OG_MESH_KEY "{secrets.token_urlsafe(36)}"\n' +
              f'#define OG_CONTROL_KEY "{secrets.token_urlsafe(36)}"\n' +
              '#define OG_CONTROLLER_ID "NEST-001122AABBCC"\n' +
              f'#define OG_OTA_PUBLIC_KEY_HEX "{public}"\n' +
              ''.join(f'#define {name} "{secrets.token_urlsafe(36)}"\n' for name in
                ('OG_MAINT_AP_PASSWORD','OG_MAINT_HTTP_PASSWORD','OG_OTA_PASSWORD')))
          PY
      - run: cd OrmanGozu_Node && pio run -e heltec_wifi_lora_32_V3
      - name: Destroy dummy secrets and CI build outputs
        if: always()
        run: rm -rf OrmanGozu_Node/.pio OrmanGozu_Node/src/secrets.h
