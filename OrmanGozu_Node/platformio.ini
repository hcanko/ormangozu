; IMPORTANT: Verify actual PCB revision, SX1262 pins and flash size before flashing.
; This baseline assumes the original GitHub main environment (Heltec V3/8MB).
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit MLX90640 @ ^1.1.1
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.14.5
    mikalhart/TinyGPSPlus @ ^1.0.3
    jgromes/RadioLib @ ^6.5.0
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0

; Do not select 16 MB unless actual flash chip is VERIFIED 16 MB.
[env:heltec_wifi_lora_32_V3_16mb]
extends = env:heltec_wifi_lora_32_V3
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
